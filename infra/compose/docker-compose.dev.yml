# Local development stack: PostgreSQL + Redis.
# Usage (from repo root):
#   docker compose --env-file .env -f infra/compose/docker-compose.dev.yml up -d
# Without .env, safe local-only defaults below are used.
# Ports bind to 127.0.0.1 only, so the services are not reachable from the network.

name: bitabar-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bitabar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitabar_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-bitabar}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
